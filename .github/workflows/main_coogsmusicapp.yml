name: Build and deploy Node.js app to Azure Web App - CoogsMusicApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Set environment variables from GitHub Secrets
        run: |
          echo "CLERK_API_KEY=${{ secrets.CLERK_API_KEY }}" >> $GITHUB_ENV
          echo "REACT_APP_CLERK_FRONTEND_API=${{ secrets.REACT_APP_CLERK_FRONTEND_API }}" >> $GITHUB_ENV

      - name: Install server dependencies
        run: |
          cd server
          # Create server .env file
          echo "CLERK_API_KEY=$CLERK_API_KEY" > .env
          npm install
          npm install dotenv @clerk/clerk-sdk-node  # Install dotenv and Clerk SDK for server

      - name: Install client dependencies and build
        run: |
          cd client
          # Create client .env file
          echo "REACT_APP_CLERK_FRONTEND_API=$REACT_APP_CLERK_FRONTEND_API" > .env
          npm install
          npm install @clerk/clerk-react react-icons react-chartjs-2 chart.js
          cat .env   # Debug step
          npm run build

      - name: Move client build to server
        run: mv client/build server/build

      - name: Zip artifact for deployment
        run: zip -r release.zip server/*

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AZURE_ACCESS_KEY as env variable
        run: echo "AZURE_ACCESS_KEY=${{ secrets.AZURE_ACCESS_KEY }}" >> $GITHUB_ENV

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CoogsMusicApp'
          slot-name: 'Production'
          package: server/
