name: Build and deploy Node.js app to Azure Web App - CoogsMusicApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install server dependencies
        run: |
          cd server
          npm install
          npm install dotenv @clerk/clerk-sdk-node  # Install dotenv and Clerk SDK for server

      - name: Install client dependencies and build
        run: |
          cd client
          npm install
          # ensure Clerk, icons, and chart libs are installed
          npm install @clerk/clerk-react react-icons react-chartjs-2 chart.js
          cat .env   # Debug step
          npm run build


      - name: Move client build to server
        run: mv client/build server/build

      - name: Zip artifact for deployment
        run: zip -r release.zip server/*

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BB772A2201B940BF9C0B32F02AAD1854 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_463A9B1956C84010A2CA228B9EC01DFB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_43353BD398484D5197A9D75B1A329D5A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CoogsMusicApp'
          slot-name: 'Production'
          package: server/